<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Synopia</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEEF1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".22"/>
    </filter>
  </defs>
  <!-- macOS grid: 824x824 body centred on a 1024 canvas, 100px margin -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#1F2328" stroke-opacity=".1" stroke-width="2"/>
  <!-- the agent mark in the light palette: track, a still 40% arc, solid core (app viewBox 12 scaled x45) -->
  <g fill="none" stroke-linecap="round">
    <circle cx="512" cy="512" r="216" stroke="#C6E9D0" stroke-width="81"/>
    <circle cx="512" cy="512" r="216" stroke="#1A7F37" stroke-width="81" pathLength="100" stroke-dasharray="40 60" transform="rotate(-150 512 512)"/>
  </g>
  <circle cx="512" cy="512" r="81" fill="#1A7F37"/>
</svg>
