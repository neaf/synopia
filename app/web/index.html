<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- A fallback for the header server.ts sends (contentSecurityPolicy), which also names the port. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synopia</title>
<link rel="icon" type="image/svg+xml" href="icon/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icon/favicon-32.png">
<link rel="apple-touch-icon" href="icon/icon-256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/preview.css">
<link rel="stylesheet" href="css/dark.css">
<script src="js/theme.js"></script>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Open sessions">
    <div class="side-head"><h1>Synopia</h1><span class="conn" id="conn" role="status" hidden>Reconnecting…</span></div>
    <div class="side-scroll" id="groups"></div>
    <div class="side-foot"><span class="upd" id="upd" role="status" hidden>Update ready: restarts when idle</span><button class="theme-btn" id="theme" type="button" aria-label="Dark mode" title="Dark mode"><svg class="moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.3 10.2A5.7 5.7 0 0 1 5.8 2.7a5.7 5.7 0 1 0 7.5 7.5Z" fill="currentColor" fill-opacity=".3" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg><svg class="sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.9" fill="currentColor" fill-opacity=".3" stroke="currentColor" stroke-width="1.2"/><path d="M8 1.5v1.7M8 12.8v1.7M1.5 8h1.7M12.8 8h1.7M3.4 3.4l1.2 1.2M11.4 11.4l1.2 1.2M3.4 12.6l1.2-1.2M11.4 4.6l1.2-1.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button><button class="btn quiet" id="open">Open session</button><button class="btn" id="new">New session</button></div>
  </aside>
  <main class="conv" id="conv"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<!-- Classic scripts sharing one global scope, in this order: later files use earlier ones at load time.
     The data comes from the backend over /ws (bridge.js), authenticated with ?token=. -->
<script src="js/marks.js"></script>
<script src="js/md.js"></script>
<script src="js/store.js"></script>
<script src="js/tween.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/dnd.js"></script>
<script src="js/images.js"></script>
<script src="js/transcript.js"></script>
<script src="js/rail.js"></script>
<script src="js/card.js"></script>
<script src="js/composer.js"></script>
<script src="js/keys.js"></script>
<script src="js/open-list.js"></script>
<script src="js/preview.js"></script>
<script src="js/ui.js"></script>
<script src="js/bridge.js"></script>
</body>
</html>
