<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Synopia</title>
<style>
  /* Placeholder until S1-3 moves the prototype here. Colours from prototype/app.html. */
  :root { --canvas: #EDEFF2; --panel: #FFFFFF; --line: #D0D7DE; --ink: #1F2328; --ink-3: #6E7781;
    --red: #CF222E; --green: #1A7F37; --link: #0550AE;
    --sans: "Atkinson Hyperlegible Next", system-ui, sans-serif;
    --mono: "JetBrains Mono NL", "JetBrains Mono", ui-monospace, Menlo, monospace; }
  body { margin: 0; padding: 24px; background: var(--canvas); color: var(--ink); font: 14px/1.45 var(--sans); }
  main { max-width: 820px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px 20px; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  #state { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
  #state.ok { color: var(--green); }
  #state.bad { color: var(--red); }
  pre, textarea { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 8px; box-sizing: border-box; width: 100%; }
  pre { white-space: pre-wrap; margin: 8px 0 16px; min-height: 40px; }
  textarea { height: 80px; resize: vertical; }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>Synopia backend</h1>
  <div id="state">Connecting</div>
  <pre id="hello"></pre>
  <label for="paste">Paste here to check ⌘V</label>
  <textarea id="paste"></textarea>
  <p><a href="https://claude.com/">A link to check it opens in the browser</a></p>
  <div>Keys reaching the page (try ⌘⇧[ and ⌘⇧])</div>
  <pre id="keys"></pre>
</main>
<script>
  (function () {
    var keys = document.getElementById('keys'), seen = [];
    document.addEventListener('keydown', function (e) {
      var mods = (e.metaKey ? '⌘' : '') + (e.ctrlKey ? '⌃' : '') + (e.altKey ? '⌥' : '') + (e.shiftKey ? '⇧' : '');
      seen.unshift(mods + ' ' + e.code + ' (key ' + JSON.stringify(e.key) + ')');
      keys.textContent = seen.slice(0, 8).join('\n');
    }, true);
  })();
  (function () {
    var token = new URLSearchParams(location.search).get('token') || '';
    var state = document.getElementById('state');
    var ws = new WebSocket('ws://' + location.host + '/ws');
    ws.onopen = function () { ws.send(JSON.stringify({ t: 'auth', token: token })); };
    ws.onmessage = function (e) {
      var msg = JSON.parse(e.data);
      if (msg.t === 'hello') {
        state.textContent = 'Connected';
        state.className = 'ok';
        document.getElementById('hello').textContent = JSON.stringify(msg, null, 2);
      }
    };
    ws.onclose = function (e) {
      state.textContent = 'Disconnected (' + e.code + ')';
      state.className = 'bad';
    };
  })();
</script>
</body>
</html>
